# 更新日志 — TOML 格式（供卡片渲染引擎读取）
# 每个版本一个 [[update]] 条目

[[update]]
version = "beta 0.8.1"
date = "2026.5.8"
tag = "稳定性与体验优化"
changes = [
  # ── 新功能 ──
  { type = "feature", text = "好感度按聊天隔离：每个群/私聊的好感度独立计算，不再全局共享" },
  { type = "feature", text = "反刷屏禁言：检测重复@机器人刷屏，超阈值自动禁言+警告（可配置阈值和时长）" },

  # ── 优化 ──
  { type = "improve", text = "卡片生成异步化：天气/快递/更新日志三大指令不再阻塞聊天线程" },
  { type = "improve", text = "好感度列表按当前聊天过滤，显示昵称而非原始 QQ 号" },

  # ── 变更 ──
  { type = "change", text = "好感度存储 key 格式变更：username → g{群号}:{QQ} / p:{QQ}（旧数据自动清理）" },
  { type = "change", text = "新增配置项 spam_threshold（刷屏阈值）和 mute_duration（禁言时长）" },
]

