# roles.toml — 角色权限配置
# 复制为 roles.toml 并填入你的值
#
# 注意：KOOK 的 user_id / channel_id 通常是纯数字字符串（如 "1234567890123456"）

# 主人用户 ID（唯一，KOOK 用户 ID）
admin_qq = 0

# 全局 OP 列表（需先用 .op add 注册，再 .op group set 指派到字频道）
op_qqs = [
    # 1234567890123456,
]

# 字频道 OP 指派 — OP 只在自己被指派的字频道有管理权
[group_owners]
# 字频道ID = [OP的用户ID列表]
# 1234567890123456 = [
#     1234567890123456,
# ]

# 用户ID → 昵称映射（优先级最高，覆盖在线查询）
[qq_name_map]
# "1234567890123456" = "小明"
