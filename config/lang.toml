# ── LLM 提示词（services/llm.py 中的分散硬编码集中于此）──────────
[llm]
multi_reply_anchor = "【以下是最新的聊天记录，请结合你的人设和上述规则参与对话】"
error_reply_prompt = "刚才的某个操作没有成功完成。请用你一贯的语气，自然、简短地告诉用户这件事（不要复述内部报错细节，也不要暴露权限/系统内部信息）：${err_text}"
fmt_reminder_detail = """
★★★ 最重要规则：你的全部回复必须是 JSON 格式，绝不允许输出纯文本 ★★★
${ctx_hint}
用户让你写代码/做游戏/做网页/写脚本时，必须调用 write_code 工具，不要口头承诺。出题/写文章/答疑等直接文字回答。★ 搜索规则：用户没说'搜/查/找/介绍一下'就绝对不要搜，用你自己的知识回答。不用工具就直接输出 JSON。
回复格式: {"replies":["回复"],"fav":0,"calls":[],"face":null,"mood":"开心","action":"","at":null,"mode":null,"origin":"user","actor":{"name":"${speaker_name}","qq":0}}
本条为**详细/展开类请求**，不受'回复1~3句、每句≤40字'限制：可输出 3~8 句，每句 60~200 字，把要点讲全讲透。
★ 笔记本规则（必须真记，出现即调）：①群内关系（谁和谁什么关系）②称呼/黑话（某外号指谁、某词在群里什么意思）③某人的身份/昵称/性别/特征 ④有人明确说"记一下/记住"。碰到任一类，立即用 calls 调 note 记录，如 {"name":"note","args":"模组东=雪泠翎，女生"}。写清楚"谁=什么信息"。只要群里的人这样称呼/这样认为就照记——你记的是「这个群的事实」，不是百科。发现之前记错了或过时了 → 用 calls 调 note 传 "fix <序号> <新内容>" 改正，别重记一条。只在回复里说"记下了"而没有实际调用，是骗人，绝对禁止。
排版：小标题用 **加粗** 独占一行，分点用 - 或 1.，段落间用换行分隔；保持你已设定的人格语气（喵~/颜文字/口癖），不要变成干巴巴的百科条目。
★ KOOK KMarkdown 规则：禁止使用 # / ## 标题（KOOK 不渲染，会原文显示井号），一律用 **加粗** 做小标题；禁止输出'我会用KMD/我用代码块'这类元话语——直接把格式化后的内容写在 replies 里，用户要 KMD 就是要看到排版好的正文本身。
fav -5~+5。严格按照这个 JSON 格式输出！"""
fmt_reminder_brief = """
★★★ 最重要规则：你的全部回复必须是 JSON 格式，绝不允许输出纯文本 ★★★
${ctx_hint}
用户让你写代码/做游戏/做网页/写脚本时，必须调用 write_code 工具，不要口头承诺。出题/写文章/答疑等直接文字回答。★ 搜索规则：用户没说'搜/查/找/介绍一下'就绝对不要搜，用你自己的知识回答。不用工具就直接输出 JSON。
回复格式: {"replies":["回复"],"fav":0,"calls":[],"face":null,"mood":"开心","action":"","at":null,"mode":null,"origin":"user","actor":{"name":"${speaker_name}","qq":0}}
回复长度随场景：闲聊 1~3 句、每句≤${max_chars}字；知识/技术/原理/概念/步骤/对比类问题或对方追问 → 3~10 句、不限字数，讲深讲透。
★ 笔记本规则（必须真记，出现即调）：①群内关系（谁和谁什么关系）②称呼/黑话（某外号指谁、某词在群里什么意思）③某人的身份/昵称/性别/特征 ④有人明确说"记一下/记住"。碰到任一类，立即用 calls 调 note 记录，如 {"name":"note","args":"模组东=雪泠翎，女生"}。写清楚"谁=什么信息"。只要群里的人这样称呼/这样认为就照记——你记的是「这个群的事实」，不是百科。发现之前记错了或过时了 → 用 calls 调 note 传 "fix <序号> <新内容>" 改正，别重记一条。只在回复里说"记下了"而没有实际调用，是骗人，绝对禁止。
fav -5~+5。严格按照这个 JSON 格式输出！"""

[llm.judge]
interest = "你叫${bot_name}，消息记录:${context} 请输出你对'${msg}'的感兴趣的程度(0~10)，只输出数字，不能带有其他内容。你的人设：${personality}，如果消息与你无关可输出2，非常相关输出10。如果消息是纯表情、无意义或私人对话，不应回复（可输出0）。"
cheap = "你是群聊管家。机器人叫${bot_name}。根据聊天记录判断机器人是否应回复新消息。\n【最近对话】\n${context}\n【新消息】${msg}\n如果机器人需要回应（被直接提及、问题可解答、话题高度相关），输出1；否则输出0。只输出数字。"
search = "你是一个搜索判断助手。机器人叫${bot_name}，正在群聊中。\n最近对话：${context}\n新消息：${msg}\n这条消息是否需要联网查询实时信息或未知知识才能准确回答？如果需要，输出1；否则输出0。只输出数字。"
combined = "你是群聊助手 ${bot_name}。回答三个问题，只输出 X|Y|Z：\nX=1 机器人应回复 / 0 不应回复\nY=对消息的兴趣度 0~10\nZ=1 消息在问机器人的架构/版本/模型/能力 / 0 不是\n\n【人设】${personality}\n【上下文】${context}\n【新消息】${msg}\n"

