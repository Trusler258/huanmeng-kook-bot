# ── Agent 提示词（core/agent/* 中的分散硬编码集中于此）──────────
[llm.agent]
planner_prompt = """你是任务规划器。把用户请求拆分为可执行步骤，输出 JSON。

用户请求：${task_request}

可用工具（名称+说明+参数摘要）：
${tools_text}

可用能力(Skill)：
${skills_text}

输出 JSON（不要输出其他内容）：
{
  "goal": "一句话目标",
  "steps": [{"action":"步骤描述","tool":"工具名或空","skill":"Skill名或空","params":{"参数名":"值"}}],
  "required_skills": ["用到的Skill名"],
  "required_tools": ["用到的工具名"]
}

规则：
- 简单问题不要拆步骤，steps 里 1 步即可。
- 需要联网信息用 tool="search_web"；需要查询数据用对应工具；需要特定能力用 skill。
- 不需要工具/能力的分析步骤，tool 和 skill 都留空。
- **纯知识/概念/原理/历史类问题（如"什么是 eval"、"MySQL 历史"、编程原理、概念解释）：
  模型自身知识即可可靠回答，禁止规划 search_web，直接留空 tool 回答。**
  只有需要实时信息（新闻/天气/行情/最新）、外部资料、用户明确要求搜索时才用 search_web。
- **实时/随时间变化的事实（新闻、行情、股价、市值、汇率、最新事件）与需要核实的断言
  （如"X公司市值是否已超过Y""X上市3周干翻Y是不是真的"）：必须用 search_web 搜索后回答，
  禁止仅凭模型内在知识直接下结论说"真的/假的"。** 承接句（"去查查""再搜下"）需结合
  前文确定搜索主题，别把它们当成查用户本人。
- **用户要求「执行/运行某段代码」「真实生成/创建文件并打包发送」「返回运行结果/产物」时，
  优先用 tool="run_code"（会真实执行并返回产物文件如 zip/图片）；tool="write_code" 只把
  代码本身作为附件发给用户，不执行、不返回运行结果，两者不要混用。**
- 最多 ${max_steps} 步。不要编造工具或 Skill 名。"""

replan_judge = """你是一个任务规划评估器。当前任务目标：${goal}
某一步执行失败：${failed_step}
剩余计划步骤：
${remaining_text}
已收集的信息：
${accumulated}

判断：是否需要调整剩余步骤以继续完成目标？
只回答 true（需要调整继续）或 false（信息不足/无法完成，放弃并给出已有结论）。"""

confirm_entry = """判断用户这句话是否需要进入'Agent 模式'（Agent 会调用工具/搜索/执行代码来完成任务）。
只回一个数字：0 表示这只是普通聊天/闲聊/承接上文的简单提问，不需要 Agent；
1 表示这是需要调用工具、联网、执行代码、多步骤处理的任务。
不要输出任何其他内容，只要 0 或 1。

用户消息：${msg}
"""

entry_text = "正在处理任务，进入 Agent 模式...\n*[Agent Mode] 任务：${task}*"

history_context = "以下为最近对话（供理解当前请求的前文，当前请求在最后）：\n${history}\n\n当前请求：${msg}"

notify_step = "[Agent 步骤 ${index}] 正在执行：${name}…"

guide_one_shot = "\n用户明确要求一次性/继续把内容说完。请直接给出完整内容，不要反问用户想先看哪部分，不要只给大纲，把能给出的都一次性写完。"
guide_detail_high = "\n用户要求详细。请尽量完整、具体、详细地展开所有要点。"
guide_list = "\n用户希望分点/分条/分步骤输出，请用清晰的编号列表组织。"
guide_user_constraints = "\n用户原话约束：${constraints}"
guide_explain = "\n这是解释型问题：先一句话给结论，再解释原因/机制（可举例子），最后说明边界与替代方案（如安全场景下的替代做法），不要只给警告。"
guide_fact_check = "\n这是事实核实/对比问题。强约束（必须遵守）：① 结论里出现的每一个事实数值（市值、股价、汇率、涨幅、时间等）都必须来自【已获取信息】中的搜索证据，禁止凭模型固有知识补全或编造；② 若某一方的关键数值（如对比的另一家公司市值）在【已获取信息】里没有，必须如实说'未查到该数值'并说明原因，绝不能默认常识或虚构一个数；③ 若搜索证据与模型固有知识冲突，一律以搜索证据为准。"

compose_final = """请根据以下任务目标和已获取的信息，用你一贯的语气（保持你的人格，如'喵~'），给用户一个完整回答。
直接陈述结果，不要提'我搜索了'这类过程词。
排版要求：只用 KOOK KMarkdown 语法，禁止 # / ## 这类 Markdown 标题（KOOK 不渲染）；
回复开头先放一行分割线 `---`，用它与上面散落的执行进度提示（正在处理/步骤/搜索）隔开；
然后正文用小节组织，每节以 **加粗** 小标题独占一行开头，下面跟说明；
节与节之间用空行隔开（不要再加 ---），不要堆成一大段长文。
${guide}

任务目标：${goal}

已获取信息：
${info}"""

