<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=560, initial-scale=1.0">
<title>Tracking · 幻梦</title>
<style>
:root {
  --primary:#ec4899;--primary-light:#f472b6;--accent:#8b5cf6;--accent-light:#a78bfa;--deepseek:#5686FE;--cyan:#22d3ee;
  --bg-card:rgba(20,18,32,0.55);--bg-soft:rgba(255,255,255,0.04);
  --text:#fff;--text-2:rgba(255,255,255,0.72);--text-3:rgba(255,255,255,0.40);
  --success:#34d399;--warning:#fbbf24;--danger:#f87171;--info:#60a5fa;
  --radius:15px;--radius-s:9px;
  --mono:'Consolas','JetBrains Mono','Courier New',monospace;
  --sans:'PingFang SC','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif;
  --border:rgba(255,255,255,0.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@page{margin:0}
html{width:560px;margin:0 auto;min-height:100vh}
body::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,0.025) 0%,transparent 2px),radial-gradient(circle at 75% 70%,rgba(255,255,255,0.02) 0%,transparent 2px),radial-gradient(circle at 50% 50%,rgba(255,255,255,0.015) 0%,transparent 1.5px);background-size:3px 3px,5px 5px,7px 7px;opacity:0.6}
body{width:560px;margin:0 auto;position:relative;z-index:1;background:radial-gradient(ellipse 80% 55% at 15% -10%,rgba(236,72,153,0.42) 0%,transparent 50%),radial-gradient(ellipse 70% 50% at 88% 110%,rgba(139,92,246,0.38) 0%,transparent 50%),radial-gradient(ellipse 65% 60% at 50% 50%,rgba(86,134,254,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 5% 80%,rgba(34,211,238,0.14) 0%,transparent 55%),conic-gradient(from 200deg at 30% 20%,transparent 0deg,rgba(236,72,153,0.08) 60deg,transparent 120deg,rgba(139,92,246,0.06) 200deg,transparent 280deg),linear-gradient(165deg,#07060f 0%,#0d0b1a 45%,#080a16 100%);font-family:var(--sans);color:var(--text);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{padding:22px 18px 28px}
.card{position:relative;background:var(--bg-card);border-radius:var(--radius);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:0 12px 48px rgba(0,0,0,0.65),0 0 100px rgba(236,72,153,0.10),0 0 40px rgba(139,92,246,0.08),inset 0 1px 0 rgba(255,255,255,0.12),inset 0 -1px 0 rgba(0,0,0,0.3);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--radius);padding:1px;background:linear-gradient(135deg,rgba(236,72,153,0.55) 0%,rgba(139,92,246,0.40) 35%,rgba(86,134,254,0.30) 65%,rgba(34,211,238,0.35) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}
.card::after{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);filter:blur(0.5px);z-index:3}
.head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;position:relative}
.head::after{content:'';position:absolute;bottom:-1px;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.5) 30%,rgba(139,92,246,0.4) 70%,transparent)}
.head-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,rgba(236,72,153,0.35),rgba(139,92,246,0.20)),radial-gradient(circle at 30% 30%,rgba(255,255,255,0.15),transparent 60%);border:1px solid rgba(236,72,153,0.45);box-shadow:0 4px 18px rgba(236,72,153,0.30),inset 0 1px 0 rgba(255,255,255,0.2);flex-shrink:0}
.head-text{flex:1;min-width:0}
.head-title{font-size:18px;font-weight:800;letter-spacing:0.3px;display:flex;align-items:baseline;gap:8px}
.head-title .nm{background:linear-gradient(135deg,#f472b6 0%,#ec4899 40%,#8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(236,72,153,0.4))}
.head-title .sl{color:var(--text-3);font-weight:300;-webkit-text-fill-color:var(--text-3)}
.head-title .tp{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-2);letter-spacing:1.5px;text-transform:uppercase;-webkit-text-fill-color:var(--text-2)}
.head-sub{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:4px;letter-spacing:0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head-badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:0.3px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1)}
.badge-transport{color:var(--info);background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.40);box-shadow:0 0 8px rgba(96,165,250,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.badge-delivering{color:var(--warning);background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.40);box-shadow:0 0 8px rgba(251,191,36,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.badge-signed{color:var(--success);background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.40);box-shadow:0 0 8px rgba(52,211,153,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.badge-return{color:var(--danger);background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.40);box-shadow:0 0 8px rgba(248,113,113,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.badge-pending{color:var(--text-3);background:rgba(255,255,255,0.04);border:1px solid var(--border)}
.badge-finish{color:var(--success);background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.40);box-shadow:0 0 8px rgba(52,211,153,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.latest-bar{margin:16px 24px 0;padding:12px 16px;background:linear-gradient(90deg,rgba(236,72,153,0.10),rgba(139,92,246,0.06));border:1px solid rgba(236,72,153,0.20);border-left:3px solid var(--primary);border-radius:0 var(--radius-s) var(--radius-s) 0;box-shadow:0 0 20px rgba(236,72,153,0.08)}
.latest-bar .label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--text-3);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:4px}
.latest-bar .msg{font-size:13px;color:var(--text);line-height:1.5}
.sec{padding:16px 24px 6px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec::before{content:'';width:3px;height:13px;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:2px;box-shadow:0 0 6px rgba(236,72,153,0.4)}
.sec-cn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.3px;text-transform:none}
.timeline{padding:4px 24px 8px;position:relative}
.timeline-item{display:flex;gap:12px;padding:7px 0;position:relative}
.timeline-item:not(:last-child)::before{content:'';position:absolute;left:5px;top:22px;bottom:-7px;width:1px;background:var(--border)}
.timeline-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid var(--text-3);flex-shrink:0;margin-top:4px;position:relative;z-index:1}
.timeline-dot.active{background:var(--primary);border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(236,72,153,0.20),0 0 12px rgba(236,72,153,0.6)}
.timeline-dot.done{background:var(--success);border-color:var(--success);box-shadow:0 0 8px rgba(52,211,153,0.5)}
.timeline-card{flex:1;min-width:0;padding:5px 0}
.timeline-card.current{background:rgba(236,72,153,0.08);padding:8px 14px;border-radius:var(--radius-s);border:1px solid rgba(236,72,153,0.22);box-shadow:0 0 16px rgba(236,72,153,0.06)}
.tl-time{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:0.3px;margin-bottom:2px}
.timeline-card.current .tl-time{color:var(--primary-light)}
.tl-msg{display:block;font-size:13px;color:var(--text-2);line-height:1.5}
.timeline-card.current .tl-msg{color:var(--text)}
.tip-bar{margin:10px 24px 0;padding:10px 14px;border-radius:var(--radius-s);font-size:12.5px;border-left:3px solid}
.tip-delivering{color:var(--warning);background:rgba(251,191,36,0.10);border-left-color:var(--warning);box-shadow:0 0 12px rgba(251,191,36,0.06)}
.tip-signed{color:var(--success);background:rgba(52,211,153,0.10);border-left-color:var(--success);box-shadow:0 0 12px rgba(52,211,153,0.06)}
.foot{margin-top:14px;padding:12px 24px 16px;border-top:1px solid var(--border);background:linear-gradient(180deg,rgba(0,0,0,0.15),rgba(0,0,0,0.30));display:flex;align-items:center;justify-content:space-between;position:relative}
.foot::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.4) 30%,rgba(139,92,246,0.3) 70%,transparent)}
.foot-l{font-family:var(--mono);font-size:10px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.foot-l .dot{width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;box-shadow:0 0 10px rgba(52,211,153,0.7),0 0 4px rgba(52,211,153,0.9)}
.foot-l .pk{color:var(--primary-light)}
.foot-r{font-family:var(--mono);font-size:9px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1.8px;text-transform:uppercase;opacity:0.7}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="head">
<div class="head-ico">{{STATE_ICON}}</div>
<div class="head-text">
<div class="head-title"><span class="nm">{{CP_NAME}}</span><span class="sl">·</span><span class="tp">TRACKING</span></div>
<div class="head-sub">{{TRACKING_NO}}</div>
</div>
<div class="head-badge {{STATE_CLASS}}">{{STATE_TEXT}}</div>
</div>
{{LATEST_SECTION}}
<div class="sec"><span class="sec-cn">物流轨迹</span></div>
<div class="timeline">{{TIMELINE_ITEMS}}</div>
{{TIP_SECTION}}
<div class="foot">
<div class="foot-l"><span class="dot"></span><span class="pk">幻梦 Bot</span><span>·</span><span>{{QUERY_TIME}}</span><span>·</span><span>{{BRAND}}</span></div>
<div class="foot-r">HUANMENG</div>
</div>
</div></div>
</body></html>
