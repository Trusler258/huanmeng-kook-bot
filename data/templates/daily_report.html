<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720, initial-scale=1.0">
<title>Daily Report · 幻梦</title>
<style>
:root {
  --primary:#ec4899;--primary-light:#f472b6;--accent:#8b5cf6;--accent-light:#a78bfa;--deepseek:#5686FE;--cyan:#22d3ee;
  --bg-card:rgba(20,18,32,0.55);--bg-soft:rgba(255,255,255,0.04);
  --text:#fff;--text-2:rgba(255,255,255,0.72);--text-3:rgba(255,255,255,0.40);
  --success:#34d399;--warning:#fbbf24;--danger:#f87171;--info:#60a5fa;
  --gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;
  --radius:16px;--radius-s:9px;
  --mono:'Consolas','JetBrains Mono','Courier New',monospace;
  --sans:'PingFang SC','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif;
  --border:rgba(255,255,255,0.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@page{margin:0}
html{width:720px;margin:0 auto;min-height:100vh}
body::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,0.025) 0%,transparent 2px),radial-gradient(circle at 75% 70%,rgba(255,255,255,0.02) 0%,transparent 2px),radial-gradient(circle at 50% 50%,rgba(255,255,255,0.015) 0%,transparent 1.5px);background-size:3px 3px,5px 5px,7px 7px;opacity:0.6}
body{width:720px;margin:0 auto;position:relative;z-index:1;background:radial-gradient(ellipse 80% 55% at 15% -10%,rgba(236,72,153,0.42) 0%,transparent 50%),radial-gradient(ellipse 70% 50% at 88% 110%,rgba(139,92,246,0.38) 0%,transparent 50%),radial-gradient(ellipse 65% 60% at 50% 50%,rgba(86,134,254,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 5% 80%,rgba(34,211,238,0.14) 0%,transparent 55%),conic-gradient(from 200deg at 30% 20%,transparent 0deg,rgba(236,72,153,0.08) 60deg,transparent 120deg,rgba(139,92,246,0.06) 200deg,transparent 280deg),linear-gradient(165deg,#07060f 0%,#0d0b1a 45%,#080a16 100%);font-family:var(--sans);color:var(--text);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{padding:24px 20px 30px}
.card{position:relative;background:var(--bg-card);border-radius:var(--radius);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:0 12px 48px rgba(0,0,0,0.65),0 0 100px rgba(236,72,153,0.10),0 0 40px rgba(139,92,246,0.08),inset 0 1px 0 rgba(255,255,255,0.12),inset 0 -1px 0 rgba(0,0,0,0.3);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--radius);padding:1px;background:linear-gradient(135deg,rgba(236,72,153,0.55) 0%,rgba(139,92,246,0.40) 35%,rgba(86,134,254,0.30) 65%,rgba(34,211,238,0.35) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}
.card::after{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);filter:blur(0.5px);z-index:3}
.head{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;position:relative}
.head::after{content:'';position:absolute;bottom:-1px;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.5) 30%,rgba(139,92,246,0.4) 70%,transparent)}
.logo{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,rgba(236,72,153,0.35),rgba(139,92,246,0.20)),radial-gradient(circle at 30% 30%,rgba(255,255,255,0.15),transparent 60%);border:1px solid rgba(236,72,153,0.45);box-shadow:0 4px 20px rgba(236,72,153,0.35),inset 0 1px 0 rgba(255,255,255,0.2);flex-shrink:0}
.head-text{flex:1;min-width:0}
.head-title{font-size:20px;font-weight:800;letter-spacing:0.3px;display:flex;align-items:baseline;gap:10px}
.head-title .nm{background:linear-gradient(135deg,#f472b6 0%,#ec4899 40%,#8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(236,72,153,0.4))}
.head-title .sl{color:var(--text-3);font-weight:300;-webkit-text-fill-color:var(--text-3)}
.head-title .tp{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text-2);letter-spacing:1.8px;text-transform:uppercase;-webkit-text-fill-color:var(--text-2)}
.head-sub{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:5px;letter-spacing:0.3px}
.head-tag{font-family:var(--mono);font-size:11px;color:#fff;background:linear-gradient(135deg,rgba(236,72,153,0.25),rgba(139,92,246,0.20));border:1px solid rgba(236,72,153,0.45);padding:5px 12px;border-radius:20px;letter-spacing:0.3px;white-space:nowrap;box-shadow:0 4px 14px rgba(236,72,153,0.25),inset 0 1px 0 rgba(255,255,255,0.15)}
.summary{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.sum-item{flex:1;background:rgba(20,18,32,0.4);padding:16px 8px 12px;text-align:center}
.sum-num{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--text);letter-spacing:0.5px;line-height:1.1}
.sum-num.c-pink{color:var(--primary-light);text-shadow:0 0 14px rgba(244,114,182,0.5)}
.sum-num.c-purple{color:var(--accent-light);text-shadow:0 0 14px rgba(167,139,250,0.5)}
.sum-num.c-amber{color:var(--warning);text-shadow:0 0 14px rgba(251,191,36,0.5)}
.sum-num.c-green{color:var(--success);text-shadow:0 0 14px rgba(52,211,153,0.5)}
.sum-lbl{font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-top:4px;letter-spacing:0.8px;text-transform:uppercase}
.sec{padding:16px 28px 6px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec::before{content:'';width:3px;height:13px;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:2px;box-shadow:0 0 6px rgba(236,72,153,0.4)}
.sec-cn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.3px;text-transform:none}
.rank-list{padding:4px 28px 8px}
.rrow{display:flex;align-items:center;gap:10px;padding:7px 12px;margin-bottom:3px;border-radius:var(--radius-s);background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04)}
.rnum{width:24px;font-family:var(--mono);font-size:13px;font-weight:800;text-align:center;color:var(--text-3);flex-shrink:0}
.rnum.r1{color:var(--gold);text-shadow:0 0 8px rgba(251,191,36,0.6)}
.rnum.r2{color:var(--silver);text-shadow:0 0 6px rgba(203,213,225,0.4)}
.rnum.r3{color:var(--bronze);text-shadow:0 0 6px rgba(217,119,6,0.4)}
.rname{width:96px;font-size:13px;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar-w{flex:1;height:16px;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.03)}
.rbar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:8px;box-shadow:0 0 8px rgba(236,72,153,0.4)}
.rbar.rb1{background:linear-gradient(90deg,var(--gold),#fde68a);box-shadow:0 0 8px rgba(251,191,36,0.5)}
.rbar.rb2{background:linear-gradient(90deg,var(--silver),#e2e8f0);box-shadow:0 0 6px rgba(203,213,225,0.3)}
.rbar.rb3{background:linear-gradient(90deg,var(--bronze),var(--gold));box-shadow:0 0 6px rgba(217,119,6,0.4)}
.rcnt{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);width:40px;text-align:right;flex-shrink:0}
.hours{display:flex;gap:2px;padding:4px 28px 12px;align-items:stretch}
.hr-c{flex:1;height:24px;border-radius:3px;background:rgba(255,255,255,0.04);position:relative}
.hr-c.l1{background:rgba(236,72,153,0.22)}
.hr-c.l2{background:rgba(236,72,153,0.40)}
.hr-c.l3{background:rgba(236,72,153,0.60)}
.hr-c.l4{background:rgba(236,72,153,0.80)}
.hr-c.l5{background:var(--primary);box-shadow:0 0 8px rgba(236,72,153,0.6)}
.hours-labels{display:flex;padding:0 28px 12px;font-family:var(--mono);font-size:9px;color:var(--text-3);letter-spacing:0.3px}
.hours-labels span{flex:1;text-align:center}
.hours-labels span:first-child{text-align:left}
.hours-labels span:last-child{text-align:right}
.facts{padding:4px 28px 10px}
.fn-it{font-size:12.5px;color:var(--text-2);line-height:1.6;padding:7px 14px;margin-bottom:3px;border-left:2px solid var(--border);background:rgba(255,255,255,0.02);border-radius:0 var(--radius-s) var(--radius-s) 0}
.fn-it strong{color:var(--primary-light);font-weight:700}
.foot{padding:14px 28px 18px;border-top:1px solid var(--border);background:linear-gradient(180deg,rgba(0,0,0,0.15),rgba(0,0,0,0.30));display:flex;align-items:center;justify-content:space-between;position:relative}
.foot::before{content:'';position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,0.4) 30%,rgba(139,92,246,0.3) 70%,transparent)}
.foot-l{font-family:var(--mono);font-size:10px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.foot-l .dot{width:7px;height:7px;background:var(--success);border-radius:50%;display:inline-block;box-shadow:0 0 10px rgba(52,211,153,0.7),0 0 4px rgba(52,211,153,0.9)}
.foot-l .pk{color:var(--primary-light)}
.foot-r{font-family:var(--mono);font-size:10px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;text-transform:uppercase;opacity:0.7}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="head">
<div class="logo">📊</div>
<div class="head-text">
<div class="head-title"><span class="nm">幻梦</span><span class="sl">·</span><span class="tp">DAILY REPORT</span></div>
<div class="head-sub">{{GROUP_ID}} · {{REPORT_DATE}}</div>
</div>
<div class="head-tag">{{GROUP_NAME}}</div>
</div>
<div class="summary">
<div class="sum-item"><div class="sum-num c-pink">{{TOTAL_MSGS}}</div><div class="sum-lbl">Total</div></div>
<div class="sum-item"><div class="sum-num c-purple">{{PARTICIPANTS}}</div><div class="sum-lbl">Speakers</div></div>
<div class="sum-item"><div class="sum-num c-amber">{{PEAK_HOUR}}</div><div class="sum-lbl">Peak</div></div>
<div class="sum-item"><div class="sum-num c-green">{{AVG_MSG}}</div><div class="sum-lbl">Avg</div></div>
</div>
<div class="sec"><span class="sec-cn">发言排行</span></div>
<div class="rank-list">{{RANKING_ROWS}}</div>
<div class="sec"><span class="sec-cn">24h 活跃热力</span></div>
<div class="hours">{{HOURS_CELLS}}</div>
<div class="hours-labels"><span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>23</span></div>
<div class="sec"><span class="sec-cn">幻梦锐评</span></div>
<div class="facts">{{FUN_FACTS}}</div>
<div class="foot">
<div class="foot-l"><span class="dot"></span><span class="pk">幻梦 Bot</span><span>·</span><span>每日 {{REPORT_TIME}}</span><span>·</span><span>{{BRAND}}</span></div>
<div class="foot-r">HUANMENG</div>
</div>
</div></div>
</body></html>
