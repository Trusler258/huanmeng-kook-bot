<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>快递物流卡片</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-accent: #0f3460;
  --accent-purple: #a855f7;
  --accent-pink: #ec4899;
  --accent-emerald: #10b981;
  --accent-blue: #3b82f6;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --card-bg: rgba(255, 255, 255, 0.04);
  --card-border: rgba(255, 255, 255, 0.08);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body { width:760px; margin:0 auto; background:transparent; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif; color:var(--text-primary); line-height:1.6;
  font-size:15px; overflow-x:hidden;
  background:
    radial-gradient(ellipse at 10% -5%, rgba(168,85,247,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 90% 105%, rgba(236,72,153,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(16,185,129,0.05) 0%, transparent 60%),
    linear-gradient(160deg, var(--bg-primary) 0%, var(--bg-secondary) 40%, var(--bg-accent) 100%);
  min-height:100vh;
}

.card-wrapper { padding:28px 24px 36px; }

.card {
  background: var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 80px rgba(168,85,247,0.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter:blur(20px); overflow:hidden; position:relative;
}
.card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple), var(--accent-blue));
}

/* ── 头部：单号+状态 ── */
.header { padding:26px 30px 22px; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.header-left { display:flex; align-items:center; gap:14px; flex:1; }
.header-icon-wrap {
  width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:26px; flex-shrink:0;
  background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.2));
  border:1px solid rgba(168,85,247,0.3); box-shadow: 0 2px 12px rgba(168,85,247,0.25);
}
.cp-name { font-size:18px; font-weight:700; }
.tracking-no-label { font-size:11px; color:var(--text-muted); margin-top:2px; letter-spacing:0.5px; }
.tracking-no-value {
  font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600;
  color:var(--accent-purple); letter-spacing:0.5px; margin-top:2px;
}
.state-badge {
  display:inline-flex; align-items:center; gap:6px; padding:7px 16px;
  border-radius:20px; font-size:13px; font-weight:700; letter-spacing:0.5px; white-space:nowrap;
}
/* 状态颜色 */
.badge-signed     { background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.35); box-shadow:0 0 12px rgba(16,185,129,0.15); }
.badge-delivering{ background:rgba(59,130,246,0.15); color:#60a5fa; border:1px solid rgba(59,130,246,0.35); box-shadow:0 0 12px rgba(59,130,246,0.15); }
.badge-transport  { background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.35); box-shadow:0 0 12px rgba(245,158,11,0.15); }
.badge-pending    { background:rgba(148,163,184,0.15); color:#94a3b8; border:1px solid rgba(148,163,184,0.35); }
.badge-return     { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.35); box-shadow:0 0 12px rgba(239,68,68,0.15); }
.badge-finish     { background:rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.35); }

/* 最新动态提示条 */
.latest-bar {
  margin:0 30px; padding:12px 16px; border-radius:var(--radius-sm); font-size:14px;
  background: linear-gradient(90deg, rgba(168,85,247,0.08), rgba(59,130,246,0.06));
  border-left:3px solid var(--accent-purple); color:var(--text-secondary); line-height:1.65;
}
.latest-bar .label { color:var(--text-muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; display:block; }
.latest-bar .msg { color:var(--text-primary); }

.divider { height:1px; margin:0 28px; background: linear-gradient(90deg, transparent, var(--card-border) 20%, var(--accent-purple) 50%, var(--card-border) 80%, transparent); }

/* ── 物流时间线 ── */
.timeline-section { padding:8px 30px 24px; }
.timeline-title { font-size:15px; font-weight:700; color:var(--accent-pink); margin-bottom:16px; display:flex; align-items:center; gap:8px; }

.timeline { position:relative; padding-left:28px; }
.timeline::before {
  content:''; position:absolute; left:9px; top:4px; bottom:4px; width:2px;
  background: linear-gradient(180deg, var(--accent-purple), var(--accent-pink), transparent);
  border-radius:1px;
}

.timeline-item { position:relative; margin-bottom:16px; }
.timeline-item:last-child { margin-bottom:0; }

/* 圆点 */
.timeline-dot {
  position:absolute; left:-28px; top:4px; width:14px; height:14px; border-radius:50%;
  border:2px solid var(--accent-purple); background:var(--bg-primary); z-index:2;
}
.timeline-dot.active {
  background:var(--accent-purple); box-shadow: 0 0 10px rgba(168,85,247,0.5), 0 0 20px rgba(168,85,247,0.2);
  animation: pulse-dot 2s ease-in-out infinite;
}
.timeline-dot.done { border-color: var(--accent-emerald); background: var(--accent-emerald); opacity: 0.6; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.7;transform:scale(.85);} }

/* 连接线段 */
.timeline-item .dot-line {
  position:absolute; left:-21px; top:18px; width:2px; height:calc(100% + 4px);
  background: rgba(148,163,184,0.15);
}

/* 内容卡 */
.timeline-card {
  padding:10px 16px; border-radius:var(--radius-sm); font-size:13.5px;
  background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05);
  transition: all 0.2s;
}
.timeline-card:hover { background: rgba(168,85,247,0.06); border-color: rgba(168,85,247,0.15); }
.timeline-card.current { background: rgba(168,85,247,0.07); border-color: rgba(168,85,247,0.2); }

.tl-time {
  font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:600;
  color:var(--accent-pink); letter-spacing:0.5px; margin-bottom:4px; display:block;
}
.tl-msg { color:var(--text-secondary); line-height:1.6; word-break:break-all; }

/* 底部提示 */
.tip-bar { margin:0 30px; padding:10px 16px; border-radius:var(--radius-sm); font-size:12.5px; text-align:center; }
.tip-delivering { color:var(--accent-blue); background:rgba(59,130,246,0.06); border:1px dashed rgba(59,130,246,0.2); }
.tip-signed { color:var(--accent-emerald); background:rgba(16,185,129,0.06); border:1px dashed rgba(16,185,129,0.2); }

/* ── 底部 ── */
.footer {
  padding:14px 30px 18px; display:flex; align-items:center; justify-content:space-between;
  border-top:1px solid var(--card-border); background:rgba(0,0,0,0.15);
}
.footer-info { display:flex; align-items:center; gap:14px; font-size:11px; color:var(--text-muted); }
.footer-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px; }
.footer-brand { font-size:10px; color:var(--text-muted); opacity:0.5; letter-spacing:1px; }

</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <!-- 头部 -->
    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="header-icon-wrap">📦</div>
          <div>
            <div class="cp-name">{{CP_NAME}}</div>
            <div class="tracking-no-label">TRACKING NO.</div>
            <div class="tracking-no-value">{{TRACKING_NO}}</div>
          </div>
        </div>
        <div class="state-badge {{STATE_CLASS}}">{{STATE_ICON}}{{STATE_TEXT}}</div>
      </div>
    </div>

    <!-- 最新动态 -->
    {{LATEST_SECTION}}

    <div class="divider"></div>

    <!-- 物流时间线 -->
    <div class="timeline-section">
      <div class="timeline-title">📍 物流轨迹</div>
      <div class="timeline">{{TIMELINE_ITEMS}}</div>
    </div>

    <!-- 提示条 -->
    {{TIP_SECTION}}

    <div class="divider"></div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer-info">
        <span class="footer-tag">📦 物流查询</span>
        <span class="footer-tag">{{QUERY_TIME}}</span>
      </div>
      <div class="footer-brand">{{BRAND}}</div>
    </div>

  </div>
</div>

</body>
</html>
